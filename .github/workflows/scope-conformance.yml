name: Scope Conformance

# Runs the Go capability-scope package, including TestConformanceVectors which
# loads pkg/agent/scope/testdata/vectors.json (vendored from the canonical
# @crowe/code-capability copy in crowe-id via scripts/sync-conformance-vectors.sh).
# This is the Go side of the TS<->Go parity gate for the Crowe Code Capability
# Protocol: if the Go resolver drifts from the shared vectors, this fails.

on:
  push:
    paths:
      - 'pkg/agent/scope/**'
      - '.github/workflows/scope-conformance.yml'
  pull_request:
    paths:
      - 'pkg/agent/scope/**'
  workflow_dispatch:

jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.6'
      - run: go test ./pkg/agent/scope/...
      - run: go vet ./pkg/agent/scope/...
