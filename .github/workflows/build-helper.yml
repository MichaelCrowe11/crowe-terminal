# Build Helper workflow - Builds, signs, and packages binaries for each supported platform, then uploads to a staging bucket in S3 for wider distribution.
# For more information on the macOS signing and notarization, see https://www.electron.build/code-signing and https://www.electron.build/configuration/mac
# For more information on the Windows Code Signing, see https://docs.digicert.com/en/digicert-keylocker/ci-cd-integrations/plugins/github-custom-action-for-keypair-signing.html and https://docs.digicert.com/en/digicert-keylocker/signing-tools/sign-authenticode-with-electron-builder-using-ksp-integration.html

name: Build Helper
run-name: Build ${{ github.ref_name }}${{ github.event_name == 'workflow_dispatch' && ' - Manual' || '' }}
on:
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+*"
    workflow_dispatch:
env:
    GO_VERSION: "1.25.6"
    NODE_VERSION: 22
    NODE_OPTIONS: --max-old-space-size=4096
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
    build-app:
        outputs:
            version: ${{ steps.set-version.outputs.WAVETERM_VERSION }}
            productname: ${{ steps.set-version.outputs.PRODUCT_NAME }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: "darwin"
                      runner: "macos-latest"
                    - platform: "linux"
                      runner: "ubuntu-latest"
                    - platform: "linux"
                      runner: ubuntu-24.04-arm
                    # Windows builds are unsigned until the DigiCert Keylocker secrets
                    # (SM_HOST, SM_API_KEY, SM_CODE_SIGNING_CERT_SHA1_HASH,
                    # SM_CLIENT_CERT_PASSWORD, SM_CLIENT_CERT_FILE_B64) exist and the
                    # ENABLE_WINDOWS_SIGNING repository variable is set to "true".
                    - platform: "windows"
                      runner: "windows-latest"
                    - platform: "windows"
                      runner: "windows-11-arm"
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v6
            - name: Install Linux Build Dependencies (Linux only)
              if: matrix.platform == 'linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends -y libarchive-tools libopenjp2-tools rpm squashfs-tools
                  # Pinned to 8.x: snapcraft 9 removed the `snap` subcommand in favour of
                  # `pack`. electron-builder only ships a prebuilt snap template for amd64,
                  # so arm64 shells out to `snapcraft snap` and fails on 9.x.
                  sudo snap install snapcraft --classic --channel=8.x
                  # snapcraft shells out to an unprivileged `snap install core22` for the
                  # base declared in electron-builder.config.cjs, which fails on the runner.
                  # Installing it here with sudo means snapcraft finds it already present.
                  sudo snap install core22
                  sudo snap install lxd
                  sudo lxd init --auto
                  sudo snap refresh
            - name: Install Zig (not Mac)
              if: matrix.platform != 'darwin'
              uses: mlugg/setup-zig@v2

            # The pre-installed version of the AWS CLI has a segfault problem so we'll install it via Homebrew instead.
            - name: Upgrade AWS CLI (Mac only)
              if: matrix.platform == 'darwin'
              run: brew install awscli

            # The version of FPM that comes bundled with electron-builder doesn't include a Linux ARM target. Installing Gems onto the runner is super quick so we'll just do this for all targets.
            - name: Install FPM (not Windows)
              if: matrix.platform != 'windows'
              run: sudo gem install fpm
            - name: Install FPM (Windows only)
              if: matrix.platform == 'windows'
              run: gem install fpm

            # General build dependencies
            - uses: actions/setup-go@v6
              with:
                  go-version: ${{env.GO_VERSION}}
                  cache-dependency-path: |
                      go.sum
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{env.NODE_VERSION}}
                  cache: npm
                  cache-dependency-path: package-lock.json
            - name: Force git deps to HTTPS
              run: |
                  git config --global url.https://github.com/.insteadof ssh://git@github.com/
                  git config --global url.https://github.com/.insteadof git@github.com:
            - uses: nick-fields/retry@v4
              name: npm ci
              with:
                  command: npm ci --no-audit --no-fund
                  retry_on: error
                  max_attempts: 3
                  # windows-11-arm has no npm cache and compiles node-pty and
                  # better-sqlite3 from source; 5 minutes timed out three times.
                  timeout_minutes: 15
              env:
                  GIT_ASKPASS: "echo"
                  GIT_TERMINAL_PROMPT: "0"
            - name: Install Task
              uses: arduino/setup-task@v2
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: "Set Version"
              id: set-version
              run: |
                  echo "WAVETERM_VERSION=$(task version)" >> "$GITHUB_OUTPUT"
                  echo "PRODUCT_NAME=$(node -p "require('./package.json').productName")" >> "$GITHUB_OUTPUT"
              shell: bash

            # The Taskfile compiles this key into wavesrv (wavebase.CroweModelsKey). Without it every
            # shipped CroweLM mode fails with a missing credential, so refuse to build rather than
            # publish a binary whose operator panel is dead.
            - name: Require the model edge key
              run: |
                  if [ -z "$CROWE_MODELS_KEY" ]; then
                    echo "::error::CROWE_MODELS_KEY secret is missing; the CroweLM modes would ship without a credential"
                    exit 1
                  fi
              env:
                  CROWE_MODELS_KEY: ${{ secrets.CROWE_MODELS_KEY }}
              shell: bash

            # Windows Code Signing Setup
            - name: Set up certificate (Windows only)
              if: matrix.platform == 'windows' && github.event_name != 'workflow_dispatch' && vars.ENABLE_WINDOWS_SIGNING == 'true'
              run: |
                  echo "${{ secrets.SM_CLIENT_CERT_FILE_B64 }}" | base64 --decode > /d/Certificate_pkcs12.p12
              shell: bash
            - name: Set signing variables (Windows only)
              if: matrix.platform == 'windows' && github.event_name != 'workflow_dispatch' && vars.ENABLE_WINDOWS_SIGNING == 'true'
              id: variables
              run: |
                  echo "SM_HOST=${{ secrets.SM_HOST }}" >> "$GITHUB_ENV"
                  echo "SM_API_KEY=${{ secrets.SM_API_KEY }}" >> "$GITHUB_ENV"
                  echo "SM_CODE_SIGNING_CERT_SHA1_HASH=${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }}" >> "$GITHUB_ENV"
                  echo "SM_CLIENT_CERT_FILE=D:\\Certificate_pkcs12.p12" >> "$GITHUB_ENV"
                  echo "SM_CLIENT_CERT_FILE=D:\\Certificate_pkcs12.p12" >> "$GITHUB_OUTPUT"
                  echo "SM_CLIENT_CERT_PASSWORD=${{ secrets.SM_CLIENT_CERT_PASSWORD }}" >> "$GITHUB_ENV"
                  echo "C:\Program Files (x86)\Windows Kits\10\App Certification Kit" >> $GITHUB_PATH
                  echo "C:\Program Files (x86)\Microsoft SDKs\Windows\v10.0A\bin\NETFX 4.8 Tools" >> $GITHUB_PATH
                  echo "C:\Program Files\DigiCert\DigiCert Keylocker Tools" >> $GITHUB_PATH
              shell: bash
            - name: Setup Keylocker KSP (Windows only)
              if: matrix.platform == 'windows' && github.event_name != 'workflow_dispatch' && vars.ENABLE_WINDOWS_SIGNING == 'true'
              run: |
                  curl -X GET  https://one.digicert.com/signingmanager/api-ui/v1/releases/Keylockertools-windows-x64.msi/download -H "x-api-key:%SM_API_KEY%" -o Keylockertools-windows-x64.msi
                  msiexec /i Keylockertools-windows-x64.msi /quiet /qn
                  C:\Windows\System32\certutil.exe -csp "DigiCert Signing Manager KSP" -key -user
                  smctl windows certsync
              shell: cmd

            # Build and upload packages
            - name: Build (Linux)
              if: matrix.platform == 'linux'
              run: task package
              env:
                  USE_SYSTEM_FPM: true # Ensure that the installed version of FPM is used rather than the bundled one.
                  SNAPCRAFT_BUILD_ENVIRONMENT: host
                  CROWE_MODELS_KEY: ${{ secrets.CROWE_MODELS_KEY }}
            # electron-builder's own temporary keychain fails on current macos-latest images
            # ("SecKeychainUnlock: The user name or passphrase you entered is not correct" at
            # set-key-partition-list), so the certificate goes into a keychain this job owns and
            # electron-builder is handed CSC_KEYCHAIN + CSC_NAME instead of CSC_LINK. The p12
            # must be the legacy (SHA-1 MAC, 3DES/RC2) export; `security import` rejects the
            # SHA-256 MAC form with "MAC verification failed".
            - name: Import Developer ID certificate (Mac only)
              if: matrix.platform == 'darwin'
              run: |
                  set -euo pipefail
                  KC="$RUNNER_TEMP/hypheus-signing.keychain-db"
                  KC_PWD="$(uuidgen)"
                  CERT="$RUNNER_TEMP/developer-id.p12"
                  printf '%s' "$CERT_B64" | base64 --decode > "$CERT"
                  security create-keychain -p "$KC_PWD" "$KC"
                  security set-keychain-settings -lut 21600 "$KC"
                  security unlock-keychain -p "$KC_PWD" "$KC"
                  security import "$CERT" -k "$KC" -P "$CERT_PWD" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
                  security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PWD" "$KC" >/dev/null
                  security list-keychains -d user -s "$KC" login.keychain-db
                  security default-keychain -s "$KC"
                  rm -f "$CERT"
                  security find-identity -v -p codesigning "$KC"
                  echo "CSC_KEYCHAIN=$KC" >> "$GITHUB_ENV"
              env:
                  CERT_B64: ${{ secrets.PROD_MACOS_CERTIFICATE_2 }}
                  CERT_PWD: ${{ secrets.PROD_MACOS_CERTIFICATE_PWD_2 }}
              shell: bash
            # Retry Darwin build in case of notarization failures
            - uses: nick-fields/retry@v4
              name: Build (Darwin)
              if: matrix.platform == 'darwin'
              with:
                  command: task package && bash scripts/notarize-dmg.sh make
                  timeout_minutes: 120
                  retry_on: error
                  max_attempts: 3
              env:
                  USE_SYSTEM_FPM: true # Ensure that the installed version of FPM is used rather than the bundled one.
                  CSC_KEYCHAIN: ${{ env.CSC_KEYCHAIN }}
                  CSC_NAME: "Michael Crowe (6QLMV9UCPP)"
                  APPLE_ID: ${{ matrix.platform == 'darwin' && secrets.PROD_MACOS_NOTARIZATION_APPLE_ID_2 }}
                  APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'darwin' && secrets.PROD_MACOS_NOTARIZATION_PWD_2 }}
                  APPLE_TEAM_ID: ${{ matrix.platform == 'darwin' && secrets.PROD_MACOS_NOTARIZATION_TEAM_ID_2 }}
                  STATIC_DOCSITE_PATH: ${{env.STATIC_DOCSITE_PATH}}
                  CROWE_MODELS_KEY: ${{ secrets.CROWE_MODELS_KEY }}
            - name: Verify macOS signing + notarization
              if: matrix.platform == 'darwin'
              run: bash scripts/verify-mac-release.sh make
              shell: bash
            - name: Build (Windows)
              if: matrix.platform == 'windows'
              run: task package
              env:
                  USE_SYSTEM_FPM: true # Ensure that the installed version of FPM is used rather than the bundled one.
                  # Empty when signing is disabled; electron-builder treats empty CSC_LINK as unset
                  # and electron-builder.config.cjs only signs when SM_CODE_SIGNING_CERT_SHA1_HASH is present.
                  CSC_LINK: ${{ vars.ENABLE_WINDOWS_SIGNING == 'true' && steps.variables.outputs.SM_CLIENT_CERT_FILE || '' }}
                  CSC_KEY_PASSWORD: ${{ vars.ENABLE_WINDOWS_SIGNING == 'true' && secrets.SM_CLIENT_CERT_PASSWORD || '' }}
                  STATIC_DOCSITE_PATH: ${{env.STATIC_DOCSITE_PATH}}
                  CROWE_MODELS_KEY: ${{ secrets.CROWE_MODELS_KEY }}
              shell: powershell # electron-builder's Windows code signing package has some compatibility issues with pwsh, so we need to use Windows Powershell

            # Upload artifacts to the S3 staging bucket. Only runs when
            # ARTIFACTS_KEY_ID is set (the upstream Wave Terminal pipeline
            # provides these; the Crowe Logic fork doesn't yet have its own
            # S3 staging bucket). GitHub-native artifact upload below handles
            # the downstream create-release job regardless.
            - name: Upload to S3 staging
              if: github.event_name != 'workflow_dispatch' && vars.ENABLE_S3_STAGING == 'true'
              run: task artifacts:upload
              env:
                  AWS_ACCESS_KEY_ID: "${{ secrets.ARTIFACTS_KEY_ID }}"
                  AWS_SECRET_ACCESS_KEY: "${{ secrets.ARTIFACTS_KEY_SECRET }}"
                  AWS_DEFAULT_REGION: us-west-2
            - name: Upload artifacts
              uses: actions/upload-artifact@v5
              with:
                  name: ${{ matrix.runner }}
                  path: make
            - name: Upload Snapcraft logs on failure
              if: failure()
              uses: actions/upload-artifact@v5
              with:
                  name: ${{ matrix.runner }}-log
                  path: /home/runner/.local/state/snapcraft/log
    # Microsoft Store package. Independent of the DigiCert Authenticode pipeline: the Store
    # signs the MSIX during ingestion. Requires the HYPHEUS_STORE_IDENTITY_NAME and
    # HYPHEUS_STORE_PUBLISHER repository variables, copied from Partner Center after the app
    # name is reserved. Runs WACK before upload so certification failures surface here.
    build-store:
        if: vars.HYPHEUS_STORE_IDENTITY_NAME != ''
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: x64
                      runner: windows-latest
                    - arch: arm64
                      runner: windows-11-arm
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-go@v6
              with:
                  go-version: ${{env.GO_VERSION}}
                  cache-dependency-path: |
                      go.sum
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{env.NODE_VERSION}}
                  cache: npm
                  cache-dependency-path: package-lock.json
            - uses: nick-fields/retry@v4
              name: npm ci
              with:
                  command: npm ci --no-audit --no-fund
                  retry_on: error
                  max_attempts: 3
                  # windows-11-arm has no npm cache and compiles node-pty and
                  # better-sqlite3 from source; 5 minutes timed out three times.
                  timeout_minutes: 15
            - name: Install Task
              uses: arduino/setup-task@v2
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
            - name: Require the model edge key
              run: |
                  if [ -z "$CROWE_MODELS_KEY" ]; then
                    echo "::error::CROWE_MODELS_KEY secret is missing; the CroweLM modes would ship without a credential"
                    exit 1
                  fi
              env:
                  CROWE_MODELS_KEY: ${{ secrets.CROWE_MODELS_KEY }}
              shell: bash
            - name: Build MSIX
              run: task package:store -- --${{ matrix.arch }}
              env:
                  HYPHEUS_STORE_IDENTITY_NAME: ${{ vars.HYPHEUS_STORE_IDENTITY_NAME }}
                  HYPHEUS_STORE_PUBLISHER: ${{ vars.HYPHEUS_STORE_PUBLISHER }}
                  CROWE_MODELS_KEY: ${{ secrets.CROWE_MODELS_KEY }}
              shell: powershell
            - name: Windows App Certification Kit
              run: |
                  $appx = Get-ChildItem make -Filter *.appx | Select-Object -First 1
                  if (-not $appx) { throw "no .appx produced" }
                  $report = Join-Path $PWD "make\wack-${{ matrix.arch }}.xml"
                  & "C:\Program Files (x86)\Windows Kits\10\App Certification Kit\appcert.exe" reset
                  & "C:\Program Files (x86)\Windows Kits\10\App Certification Kit\appcert.exe" test -appxpackagepath $appx.FullName -reportoutputpath $report
                  [xml]$xml = Get-Content $report
                  $overall = $xml.REPORT.OVERALL_RESULT
                  Write-Host "WACK overall result: $overall"
                  if ($overall -ne "PASS") { exit 1 }
              shell: powershell
            - name: Upload Store artifacts
              uses: actions/upload-artifact@v5
              with:
                  name: store-${{ matrix.arch }}
                  path: |
                      make/*.appx
                      make/wack-*.xml

    create-release:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        needs: build-app
        permissions:
            contents: write
        if: ${{ github.event_name != 'workflow_dispatch' }}
        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                  path: make
                  merge-multiple: true
            - name: Create draft release
              uses: softprops/action-gh-release@v2
              with:
                  prerelease: ${{ contains(github.ref_name, '-beta') }}
                  name: ${{ needs.build-app.outputs.productname }} ${{ github.ref_name }} Release
                  generate_release_notes: true
                  draft: true
                  files: |
                      make/*.yml
                      make/*.zip
                      make/*.dmg
                      make/*.exe
                      make/*.msi
                      make/*.rpm
                      make/*.deb
                      make/*.pacman
                      make/*.snap
                      make/*.flatpak
                      make/*.AppImage
