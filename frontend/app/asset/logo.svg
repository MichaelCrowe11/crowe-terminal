<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Hypheus activity-bar glyph.
       Hexagon (echo of the Crowe Logic cube silhouette) carrying a single
       branching hypha with spore tips. Uses currentColor so the icon theme
       tints it, matching built-in codicons at 16 and 24 px. -->
