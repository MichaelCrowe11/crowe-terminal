  <path d="M7.2 16.2 Q12 13.2 16.6 7.4"/>
  <path d="M11.1 12.6 Q9.2 10.1 9.5 6.9"/>
  <circle cx="16.9" cy="6.8" r="1.15" fill="currentColor" stroke="none"/>
  <circle cx="9.5" cy="6.5" r="0.9" fill="currentColor" stroke="none"/>
</svg>
